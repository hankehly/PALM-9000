name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # palm_9000.settings requires google_api_key at import time. This is a
  # placeholder so the package imports; no request is ever made with it.
  GOOGLE_API_KEY: ci-placeholder-not-a-real-key

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pipecat-ai[local] pulls in pyaudio, which needs PortAudio headers.
      - name: Install PortAudio
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # --group ADDS to the default groups; `dev` is enabled by default and
      # carries torch, Jupyter, LangChain and LlamaIndex. --no-default-groups
      # is what actually restricts this to the lean test group.
      - name: Install dependencies
        run: uv sync --no-default-groups --group test

      - name: Lint (ruff)
        run: uv run --no-sync ruff check --output-format=github main.py palm_9000/ tests/

      - name: Check formatting (ruff)
        run: uv run --no-sync ruff format --check --diff main.py palm_9000/ tests/

      # fail_under=100 is configured in pyproject.toml [tool.coverage.report].
      - name: Run tests with coverage
        run: uv run --no-sync pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  # The lockfile is what pins pipecat. If it drifts from pyproject.toml, a
  # deploy to the Pi can silently install something the tests never saw.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Verify uv.lock is current
        run: uv lock --check
