[project]
name = "palm-9000"
version = "0.1.0"
description = "A Raspberry Pi and LLM-powered talking palm tree"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.2.6",
    "luma-led-matrix>=1.7.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pipecat-ai[google,local,silero]>=1.11.0,<2",
    "livekit-wakeword>=0.2.1",
    # Hardware access for the Pi. Both are Linux-only wheels, so they are
    # marked accordingly and simply absent on a development Mac.
    # spidev drives the MAX7219 (palm_9000/gpio.py); RPi.GPIO drives the
    # ADC0834 (palm_9000/adc0834.py), which the soil-moisture sensor needs.
    "spidev>=3.7 ; sys_platform == 'linux'",
    "rpi-gpio>=0.7.1 ; sys_platform == 'linux'",
]

[dependency-groups]
# Lean group for the test suite and CI. Deliberately excludes the heavy
# notebook libraries in `dev` (torch, whisper, langchain, llama-index) so CI
# stays fast. Hardware libraries (RPi.GPIO, pyaudio, sounddevice, spidev) are
# faked in tests/conftest.py rather than installed.
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "scipy>=1.16.0",
    "ruff>=0.14.0",
]

# Dev-only tools and notebook libs (not installed in production when using `--no-dev`).
dev = [
    {include-group = "test"},
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "piper-tts[http]>=1.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.3",
    "pandas>=2.3.1",
    "langchain[google-genai]>=0.3.26",
    "langchain-huggingface>=0.3.0",
    "langgraph>=0.5.0",
    "openai-whisper>=20250625",
    "pvporcupine>=3.0.5",
    "pvrecorder>=1.2.7",
    "pyttsx3>=2.98",
    "scipy>=1.16.0",
    "sounddevice>=0.5.2",
    "torch>=2.7.1",
    "transformers>=4.53.0",
    "webrtcvad>=2.0.10",
    "google-genai>=1.24.0",
    "pvleopard>=2.0.5",
    "langdetect>=1.0.9",
    "pyaudio>=0.2.14",
    "llama-index-llms-huggingface-api>=0.6.0",
    "llama-index-embeddings-huggingface>=0.6.0",
    "llama-index-vector-stores-chroma>=0.5.0",
    "llama-index-readers-web>=0.5.0",
    "llama-index-tools-google>=0.6.0",
    "gpiozero>=2.0.1",
    "pigpio>=1.78",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No [build-system], so the project is not installed into the venv. Without
# this, `uv run pytest` cannot import palm_9000 or main (only `python -m
# pytest` works, because that injects CWD into sys.path).
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["palm_9000", "main"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting (replaces isort),
# UP: pyupgrade, B: bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private state deliberately to assert on internals.
"tests/*" = ["E501"]
